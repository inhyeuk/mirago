<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Mirago 앱 로그인</title>
<meta name="theme-color" content="#0a0e18">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<style>
:root{--bg:#0a0e18;--panel:#131a29;--line:#273149;--ink:#eef1f8;--muted:#9099b2;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6;font-size:15px;min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 22px;max-width:420px;width:100%;text-align:center}
h1{font-size:21px;margin:0 0 6px}
p{color:var(--muted);margin:6px 0}
button{font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:10px;padding:11px 18px;font-weight:600;margin-top:16px}
button svg{width:18px;height:18px}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{min-height:1.4em;margin-top:12px;font-size:14px}.msg.err{color:var(--bad)}
</style>
</head>
<body>
<div class="card">
  <h1>Mirago 앱 로그인</h1>
  <p>아래 버튼으로 구글 계정에 로그인하면, 로그인 결과가 이 기기의 Mirago 앱으로 넘어갑니다.</p>
  <button id="go"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Google 계정으로 로그인</button>
  <div class="msg" id="msg"></div>
</div>
<script type="module">
// 앱(WebView)에서는 구글이 로그인 창을 막으므로, 앱이 이 페이지를 기본 브라우저로 연다(#p=앱이 연 로컬 포트&s=일회용 확인값).
// 로그인에 성공하면 구글 ID 토큰을 이 기기 안의 앱(127.0.0.1)으로만 넘긴다 — 다른 서버로는 보내지 않는다.
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const app = initializeApp({
  apiKey: 'AIzaSyAlOWhVYU_0BpJqpnGGEa6RVc1KeQ5vJ0U',
  authDomain: 'mirago-app.firebaseapp.com',
  projectId: 'mirago-app',
  appId: '1:259107244535:web:6cda463c1b02048086c6f2',
});
const auth = getAuth(app);
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.hash.slice(1));
const port = q.get('p') || '', state = q.get('s') || '';
const ok = /^[0-9]{4,5}$/.test(port) && +port >= 1024 && +port <= 65535 && /^[0-9a-f]{32}$/.test(state);
history.replaceState(null, '', location.pathname);
const msg = (t, err) => { $('#msg').textContent = t; $('#msg').className = 'msg' + (err ? ' err' : ''); };
if (!ok) { $('#go').disabled = true; msg('Mirago 앱의 의견 게시판에서 로그인 버튼을 눌러 이 페이지를 열어 주세요.', true); }

$('#go').onclick = async () => {
  if (!ok) return;
  $('#go').disabled = true; msg('로그인하는 중…');
  const pv = new GoogleAuthProvider(); pv.setCustomParameters({ prompt: 'select_account' });
  try {
    const r = await signInWithPopup(auth, pv);
    const t = GoogleAuthProvider.credentialFromResult(r)?.idToken;
    if (!t) throw new Error('no-token');
    msg('로그인했습니다. 앱으로 넘기는 중…');
    location.href = `http://127.0.0.1:${port}/done?s=${state}&t=${encodeURIComponent(t)}`;
  } catch (e) {
    $('#go').disabled = false;
    const c = String(e.code || e.message || '');
    if (c.includes('popup-closed') || c.includes('cancelled-popup')) return msg('');
    msg(c.includes('popup-blocked') ? '로그인 창이 막혔습니다. 팝업을 허용한 뒤 다시 눌러 주세요.' : '로그인하지 못했습니다: ' + c, true);
  }
};
</script>
</body>
</html>
